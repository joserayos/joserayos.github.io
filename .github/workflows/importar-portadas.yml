name: Importar portadas de LinkedIn

on:
  push:
    paths:
      - .github/workflows/importar-portadas.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar portadas
        run: |
          mkdir -p img/articulos
          cd img/articulos
          dl() { curl -sSfL -A "Mozilla/5.0" -o "$1" "$2"; }
          dl 01-que-es-geo.png "https://media.licdn.com/dms/image/v2/D4E12AQEf8FNN22eBdA/article-cover_image-shrink_720_1280/B4EaCwnvjyKEAU-/0/1789669603805?e=2147483647&v=beta&t=JyKPDwHHgs4NZrEuN58Yk2laWhHQEs3nVXuqz9BPGcs"
          dl 02-diagnostico-leads.png "https://media.licdn.com/dms/image/v2/D4E12AQESubvaN-Jn8w/article-cover_image-shrink_720_1280/B4EaDCYF5pKEAQ-/0/1789967490909?e=2147483647&v=beta&t=uCcEZCGkjL0DGBN8Zh6Lwludf4UPcnQTHU0tfD8LaWI"
          dl 03-estado-marketing-panama.png "https://media.licdn.com/dms/image/v2/D4E12AQGP_QBduCfVXQ/article-cover_image-shrink_720_1280/B4EaDUuZrkJkAQ-/0/1790275329151?e=2147483647&v=beta&t=WHteZu8QhTy-k1zxEbyZB27UcQ9Eszrj2bXFrHn1tfw"
          dl 04-aparecer-en-chatgpt.png "https://media.licdn.com/dms/image/v2/D4E12AQGwO7Dn7oJpBw/article-cover_image-shrink_720_1280/B4EaDqAPsCJMAQ-/0/1790632328302?e=2147483647&v=beta&t=gQC4IiEl-8wIB-CDix_AyXwDIPR6J4J8BnGrto0awJo"
          dl 05-clinicas-ia.png "https://media.licdn.com/dms/image/v2/D4E12AQFXM9uI5DtRjA/article-cover_image-shrink_720_1280/B4EaECXaYDGwAQ-/0/1791041054557?e=2147483647&v=beta&t=Plj-AjkLEcAVk9KwD-lif11lpDa9p-_Dppv3TgsYB7g"
          dl 06-meta-ads-2026.png "https://media.licdn.com/dms/image/v2/D4E12AQF6Byks_C5SFA/article-cover_image-shrink_720_1280/B4EaEWLaBhG0AU-/0/1791373451844?e=2147483647&v=beta&t=42B-BB3qH--aJ1Zw8VuUOxT17rTTTGK2Sucy3nN2lMs"
          dl 07-meta-ads-inmobiliarias.png "https://media.licdn.com/dms/image/v2/D4E12AQGZGnNOEP_5DQ/article-cover_image-shrink_720_1280/B4EaEWWPMpIUAU-/0/1791376290931?e=2147483647&v=beta&t=WVZUamqzDomz6eibN1xXHB8Dnc2WYuRVwE0mv3tiDMM"
          ls -la
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/articulos
          git diff --cached --quiet || git commit -m "Portadas de los artículos de LinkedIn"
          git push
